spring.application.name=mediconnect-backend

# Database (override with environment variables; never commit real passwords)
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:mediconnect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate builds tables from the entities (rules declared with @Check/@OnDelete/uniqueConstraints).
# "update" only ADDS missing tables/columns: it never alters existing ones, so recreate the DB after changing rules.
spring.jpa.hibernate.ddl-auto=update
# Then run schema.sql (sequence + case-insensitive indexes Hibernate cannot generate) on every startup.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Security. JWT_SECRET: at least 32 characters; when empty a random key is used and tokens die on restart.
app.jwt.secret=${JWT_SECRET:}
# First admin, created on startup if there is none. Empty ADMIN_PASSWORD = generated and printed once in the log.
app.admin.email=${ADMIN_EMAIL:admin@mediconnect.local}
app.admin.password=${ADMIN_PASSWORD:}
# Refresh-token cookie over HTTPS only. false so it also works on http://localhost; set true in production.
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}

# Medical record uploads: stored on disk under STORAGE_DIR (kept out of git). PDF/JPEG/PNG only, max 10 MB.
app.storage.dir=${STORAGE_DIR:./data/records}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Chat: days a patient-doctor chat stays open after the encounter is finalized.
app.chat.window-days=${CHAT_WINDOW_DAYS:7}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
